<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0e152e" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="cyber-grid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); transform-origin: 1040px 140px; }
        100% { transform: rotate(360deg); transform-origin: 1040px 140px; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4; opacity: 0.7; }
        50% { r: 6.5; opacity: 1; }
      }
      .animated-float {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .pulse-orb {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .radar-line {
        animation: radarSweep 10s linear infinite;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: flowDash 2.5s linear infinite;
      }
      .pulsing-dot {
        animation: nodePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Geometric Grid Pattern (Background layer) -->
  <g stroke="url(#cyber-grid)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs (Deep Background) -->
  <circle cx="150" cy="100" r="130" fill="#3b82f6" filter="url(#glow-purple)" class="pulse-orb" opacity="0.3" />
  <circle cx="1060" cy="160" r="150" fill="#8b5cf6" filter="url(#glow-purple)" class="pulse-orb" opacity="0.25" />
  <circle cx="650" cy="380" r="140" fill="#06b6d4" filter="url(#glow-cyan)" class="pulse-orb" opacity="0.2" />

  <!-- Animated Interactive Flow Lines (Background Middle Ground) -->
  <g fill="none" stroke-width="2">
    <!-- Code-to-Cloud Pipeline Flow -->
    <path d="M 80 340 C 260 300, 320 370, 520 340 S 760 300, 940 330 S 1080 290, 1160 320" stroke="#38bdf8" stroke-opacity="0.4" class="flow-path" />
    <path d="M 40 280 C 220 250, 380 310, 600 270 S 840 240, 1140 270" stroke="#818cf8" stroke-opacity="0.3" class="flow-path" style="animation-duration: 4s;" />
  </g>

  <!-- Dynamic Decorative Visual Component: ASPM Posture Radar (Right side background) -->
  <g opacity="0.55">
    <circle cx="1040" cy="140" r="90" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="1040" cy="140" r="60" fill="none" stroke="#475569" stroke-width="1.5" />
    <circle cx="1040" cy="140" r="30" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle cx="1040" cy="140" r="4" fill="#38bdf8" />
    <!-- Rotating radar beam -->
    <line x1="1040" y1="140" x2="1130" y2="140" stroke="#38bdf8" stroke-width="2.5" class="radar-line" stroke-linecap="round" filter="url(#glow-cyan)" />
    <!-- Radar blips (Exploitable findings) -->
    <circle cx="1075" cy="115" r="4" fill="#ef4444" class="pulsing-dot" />
    <circle cx="1015" cy="170" r="4" fill="#eab308" class="pulsing-dot" style="animation-delay: 1s;" />
    <circle cx="1080" cy="165" r="4" fill="#22c55e" class="pulsing-dot" style="animation-delay: 2s;" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, & Feature Pills (Always strictly in foreground) -->

  <!-- Top Security Category Pill Badge -->
  <g transform="translate(70, 48)">
    <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.8">APPLICATION SECURITY POSTURE</text>
  </g>

  <!-- Shield Icon (Visual Brand Anchor) -->
  <g transform="translate(70, 95)" class="animated-float">
    <rect width="64" height="64" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="url(#glow-purple)" />
    <path d="M102 113 L82 122 V136 C82 147 90 156 102 161 C114 156 122 147 122 136 V122 Z" transform="translate(-70, -95)" fill="url(#shield-grad)" />
    <path d="M96 137 L100 141 L108 131" transform="translate(-70, -95)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Hero Title -->
  <text x="150" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
    Awesome ASPM
  </text>

  <!-- Subtitle Line 1 -->
  <text x="70" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    Application Security Posture Management &amp; DevSecOps Governance
  </text>

  <!-- Subtitle Line 2 / Tagline -->
  <text x="70" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
    Curated SaaS Platforms, Open-Source Engines, Code-to-Runtime Correlation &amp; Vulnerability Remediation
  </text>

  <!-- Dynamic Capability Cards / Pills (Foreground Interactive Pillars) -->
  <g transform="translate(70, 275)">
    <!-- Pill 1: Risk Correlation -->
    <g transform="translate(0, 0)">
      <rect width="210" height="48" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="24" r="6" fill="#38bdf8" />
      <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Risk Correlation</text>
      <text x="40" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Code-to-Cloud Graph</text>
    </g>

    <!-- Pill 2: Reachability & Exploitation -->
    <g transform="translate(225, 0)">
      <rect width="215" height="48" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="24" r="6" fill="#a855f7" />
      <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Runtime Reachability</text>
      <text x="40" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Exploitability Triage</text>
    </g>

    <!-- Pill 3: Agentic AI Remediation -->
    <g transform="translate(455, 0)">
      <rect width="220" height="48" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="24" r="6" fill="#10b981" />
      <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Agentic AI &amp; AutoFix</text>
      <text x="40" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Automated PR Workflows</text>
    </g>

    <!-- Pill 4: Open Source Infrastructure -->
    <g transform="translate(690, 0)">
      <rect width="235" height="48" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="24" r="6" fill="#f59e0b" />
      <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Open-Source Engines</text>
      <text x="40" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">DefectDojo, Trivy, Semgrep</text>
    </g>

    <!-- Pill 5: Supply Chain & SBOM -->
    <g transform="translate(940, 0)">
      <rect width="180" height="48" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="24" r="6" fill="#ec4899" />
      <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">SSCS &amp; SBOM</text>
      <text x="40" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">PBOM &amp; AI-BOM</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(70, 355)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">
      🛡️ DEVSECOPS &bull; SAST &bull; DAST &bull; SCA &bull; CIEM &bull; CSPM &bull; VEX &bull; SARIF &bull; OWASP TOP 10
    </text>
  </g>
</svg>
